<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#681d30"><link rel="stylesheet" href="css/app.css"><title>Roleta de Prêmios</title></head><body class="public"><main class="public-flow">
<section id="formScreen" class="public-card screen"><p class="eyebrow">BEM-VINDO(A)</p><h1>Sua chance está aqui.</h1><p>Preencha seus dados para avançar até a roleta.</p><form id="participantForm"><label>Nome*<input name="name" required autocomplete="name"></label><label>WhatsApp*<input name="whatsapp" required inputmode="tel" placeholder="(54) 99999-9999" autocomplete="tel"></label><label>Instagram <input name="instagram" placeholder="@seuusuario"></label><label>E-mail <input name="email" type="email" autocomplete="email"></label><label class="check"><input name="privacy" type="checkbox" required> Li e concordo com o uso dos meus dados nesta ação.</label><button class="primary" type="submit">Ir para a roleta</button></form><p id="formMessage" class="message"></p></section>
<section id="gameScreen" class="game-screen screen" hidden><header class="game-brand"><b id="gameTitle">ROULETA</b><small>DA SORTE</small></header><div id="slotGame" class="slot-game"><div class="machine"><div class="slot-window"><div class="slot-strip"><span>🍫</span><span>🎟️</span><span>🏷️</span><span>✦</span><span>🍫</span><span>🎟️</span></div><div class="slot-strip delay"><span>🎟️</span><span>🏷️</span><span>✦</span><span>🍫</span><span>🎟️</span><span>🏷️</span></div><div class="slot-strip delay2"><span>🏷️</span><span>✦</span><span>🍫</span><span>🎟️</span><span>🏷️</span><span>✦</span></div></div><p id="gameHint">Toque no botão para girar.</p><button id="spinButton" class="spin-button">GIRAR ✦</button></div></div><div id="wheelGame" class="wheel-game" hidden><i class="pointer">▼</i><div id="wheel" class="wheel"><span>🍫</span><span>🎟️</span><span>🏷️</span><span>✦</span><b>GIRAR</b></div><button id="wheelButton" class="spin-button">GIRAR A ROLETA</button></div></section>
<section id="resultScreen" class="public-card result-screen screen" hidden><p class="eyebrow">SEU PRÊMIO</p><div id="resultSymbol" class="big-symbol">✦</div><h1 id="resultTitle">Parabéns!</h1><code id="resultCoupon" hidden></code><p id="resultText">Seu prêmio foi registrado.</p><button id="newClient" class="primary">Novo cliente</button></section>
</main><script type="module" src="js/participar.js"></script></body></html>
