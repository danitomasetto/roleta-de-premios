<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="css/app.css"><title>Relatório · Roleta de Prêmios</title>
  <style>
    .report{max-width:1180px;margin:auto;padding:24px}.report-head{display:flex;justify-content:space-between;gap:18px;align-items:start;margin:28px 0}.report-head h1{font:700 clamp(32px,5vw,52px) 'Playfair Display';margin:0;color:var(--wine)}.report-actions{display:flex;gap:10px;flex-wrap:wrap}.report table{width:100%;border-collapse:collapse;font-size:13px}.report th,.report td{padding:11px;border-bottom:1px solid #ead6bc;text-align:left;vertical-align:top}.report th{color:var(--wine);font-size:11px;text-transform:uppercase;letter-spacing:.05em}.report .scroll{overflow:auto}.report .muted{color:#80686a}.report .winner{padding:20px;border:2px solid var(--gold);border-radius:15px;background:var(--soft)}.report .winner h2{font:700 31px 'Playfair Display';margin:4px 0;color:var(--wine)}.report .notice{padding:28px;text-align:center;color:#80686a}@media print{body{background:white}.report{max-width:none;padding:0}.report-actions,.report nav,.report .back{display:none!important}.panel{margin:18px 0;padding:18px;border:0}.three{grid-template-columns:repeat(3,1fr)}.report table{font-size:10px}.report th,.report td{padding:6px}}
  </style>
</head>
<body><main class="report">
  <nav class="back"><a class="brand" href="./">RO<span>LETA</span><small>de prêmios</small></a></nav>
  <header class="report-head"><div><p class="eyebrow">RELATÓRIO DO EVENTO</p><h1 id="reportTitle">Carregando…</h1><p class="muted" id="reportMeta"></p></div><div class="report-actions"><button class="outline" id="print">Imprimir / Salvar PDF</button><button class="primary" id="excel">Baixar planilha</button></div></header>
  <section id="summary" class="three"></section>
  <section id="winnerPanel" class="panel" hidden></section>
  <section class="panel"><p class="eyebrow" id="detailsLabel">PRÊMIOS</p><div class="scroll"><table><thead id="prizesHead"></thead><tbody id="prizesBody"></tbody></table></div></section>
  <section class="panel"><p class="eyebrow" id="peopleLabel">PARTICIPANTES</p><div class="scroll"><table><thead id="peopleHead"></thead><tbody id="peopleBody"></tbody></table></div></section>
  <section class="panel"><p class="eyebrow" id="historyLabel">HISTÓRICO</p><div class="scroll"><table><thead id="historyHead"></thead><tbody id="historyBody"></tbody></table></div></section>
</main><script type="module" src="js/relatorio.js"></script></body></html>
