<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="css/app.css"><title>Novo evento · Roleta de Prêmios</title>
  <style>
    .prize-head{display:flex;justify-content:space-between;gap:14px;align-items:end;margin-top:28px}.prize-head p{margin:0}.prize-row{display:grid;grid-template-columns:1fr 140px 92px auto;gap:9px;align-items:end;padding:10px 0;border-bottom:1px solid #ead6bc}.prize-row label{font-size:11px}.prize-row input,.prize-row select{padding:10px;border:1px solid #decdb8;border-radius:8px;background:#fff;font:inherit}.prize-row button{border:0;background:transparent;color:var(--wine);font-size:20px;padding:9px;cursor:pointer}.chance-total{margin:13px 0 0;font-size:14px;font-weight:700}.chance-total.ok{color:#1c6b4f}.chance-total.error{color:#9a2636}@media(max-width:650px){.prize-row{grid-template-columns:1fr 1fr}.prize-row label:first-child{grid-column:1/-1}.prize-row button{justify-self:end}}
  </style>
</head>
<body><main class="shell"><header><a class="brand" href="./">RO<span>LETA</span><small>de prêmios</small></a></header>
  <section class="panel create-panel"><p class="eyebrow">NOVO EVENTO</p><h1>Como será sua ação?</h1>
    <form id="eventForm">
      <label>Nome do evento<input name="title" required placeholder="Ex.: Feira de Primavera"></label>
      <p class="field-label">Tipo de evento</p>
      <div class="choices">
        <label class="choice"><input type="radio" name="eventType" value="roulette" checked><b>Roleta de Prêmios</b><small>Cliente se cadastra, gira e recebe um prêmio.</small></label>
        <label class="choice"><input type="radio" name="eventType" value="list_draw"><b>Sorteio por Lista</b><small>Importe um Excel e sorteie um registro.</small></label>
      </div>
      <div id="rouletteOptions"><p class="field-label">Modelo da roleta</p>
        <div class="choices">
          <label class="choice"><input type="radio" name="layout" value="slots" checked><b>Caça-níquel</b><small>Três rolos e alavanca.</small></label>
          <label class="choice"><input type="radio" name="layout" value="wheel"><b>Roleta circular</b><small>Roleta com ponteiro giratório.</small></label>
        </div>
        <p class="field-label">Paleta de cores</p>
        <div class="palettes">
          <label class="palette-card"><input type="radio" name="palette" data-primary="#681D30" data-secondary="#C79339" checked><span class="palette-swatch tomasetto"></span><b>Clássica</b><small>Bordô e dourado</small></label>
          <label class="palette-card"><input type="radio" name="palette" data-primary="#0F3D56" data-secondary="#41B9C5"><span class="palette-swatch oceano"></span><b>Oceano</b><small>Azul e turquesa</small></label>
          <label class="palette-card"><input type="radio" name="palette" data-primary="#174C3C" data-secondary="#D2A74B"><span class="palette-swatch floresta"></span><b>Floresta</b><small>Verde e ouro</small></label>
          <label class="palette-card"><input type="radio" name="palette" data-primary="#552047" data-secondary="#E37AA2"><span class="palette-swatch ameixa"></span><b>Ameixa</b><small>Roxo e rosa</small></label>
        </div>
        <div class="prize-head"><div><p class="field-label">Prêmios e chances</p><small>As porcentagens devem somar exatamente 100%.</small></div><button type="button" class="outline" id="addPrize">+ Adicionar prêmio</button></div>
        <div id="prizeRows"></div><p id="chanceTotal" class="chance-total"></p>
      </div>
      <button class="primary">Criar evento</button><p class="message" id="eventMessage"></p>
    </form>
  </section>
</main><script type="module" src="js/novo-evento.js"></script></body></html>
